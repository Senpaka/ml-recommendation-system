[project]
name = "pet-recommendation"
version = "0.1.0"
description = "Project recommendation system with micro services architecture"
authors = [
    {name = "Senpaka"}
]
requires-python = ">=3.13"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "optuna (>=5.0.0,<6.0.0)",
    "catboost (>=1.2.10,<2.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "implicit (>=0.7.3,<0.8.0)",
    "fastapi (>=0.159.0,<0.160.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
]

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["src", "services", "core"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["implicit.*", "sklearn.*", "catboost.*", "pandas.*", "scipy.*", "joblib.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "optuna (>=5.0.0,<6.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "pytest (>=9.1.1,<10.0.0)",
]
